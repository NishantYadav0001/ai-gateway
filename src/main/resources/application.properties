# ==========================================
# 1. AI PROVIDERS CONFIGURATION
# ==========================================
# Groq (Fast & Heavy Brains)
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.embedding.enabled=false

# Google Gemini (Premium Escalation Failsafe)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# ==========================================
# 2. VECTOR DATABASE (Pinecone)
# ==========================================
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.environment=aped-4627-b74a
spring.ai.vectorstore.pinecone.index-name=gateway-cache
spring.ai.vectorstore.pinecone.project-id=3vqcatd
spring.ai.vectorstore.pinecone.initialize-schema=false

# ==========================================
# 3. RELATIONAL DATABASE (Neon PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://ep-bitter-pine-ap3c68qc.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&user=${DB_USER}&password=${DB_PASS}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=org.postgresql.Driver
spring.sql.init.mode=always

# ==========================================
# 4. SECURITY & AUTH0 CONFIGURATION
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI}
app.security.allowed-origins=http://localhost:5173,https://*.hf.space,https://huggingface.co

# ==========================================
# 5. SERVER & DEBUGGING SETTINGS
# ==========================================
spring.main.lazy-initialization=true
management.endpoints.web.exposure.include=health
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true